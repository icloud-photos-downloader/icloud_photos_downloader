on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

name: Create Release

jobs:
  get_version:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7

    - name: Retrieve version
      id: get_version
      run: |
        echo icloudpd_version=$(cat pyproject.toml | grep version= | cut -d'"' -f 2) >> $GITHUB_OUTPUT

    - name: Log version
      run: |
        echo "icloudpd_version=${{steps.get_version.outputs.icloudpd_version}}"

    outputs:
      icloudpd_version: ${{steps.get_version.outputs.icloudpd_version}}

  extract_changelog:
    needs: [get_version]
    uses: ./.github/workflows/extract-changelog.yml
    with:
      icloudpd_version: ${{needs.get_version.outputs.icloudpd_version}}

  patch_version:
    uses: ./.github/workflows/patch-version.yml
    
  build_package:
    needs: [get_version, patch_version]
    uses: ./.github/workflows/build-package.yml
    with:
      icloudpd_version: ${{needs.get_version.outputs.icloudpd_version}}

  compile_notes:
    needs: [get_version, build_package, extract_changelog]
    uses: ./.github/workflows/compile-notes.yml
    with:
      icloudpd_version: ${{needs.get_version.outputs.icloudpd_version}}

  publish:
    needs: [get_version, build_package, compile_notes]
    uses: ./.github/workflows/publish.yml
    with:
      icloudpd_version: ${{needs.get_version.outputs.icloudpd_version}}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  # PyPI trusted publishing (no token): PyPI can't publish from a reusable workflow
  # (pypi/warehouse#11096), so this job lives here and not in publish.yml. The publisher on
  # pypi.org is registered for this workflow file and the "release" environment.
  pypi:
    needs: [get_version, build_package, compile_notes]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      id-token: write
    steps:
    - name: Download artifacts (src)
      uses: actions/download-artifact@v8
      with:
        name: icloudpd-src
        path: |
          artifacts

    - name: Download artifacts (bin)
      uses: actions/download-artifact@v8
      with:
        pattern: icloudpd-bin-*
        merge-multiple: true
        path: |
          artifacts

    - name: Collect wheels
      run: |
        mkdir -p dist
        cp artifacts/*.whl dist/
        ls -l dist

    - name: Publish PyPI
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
      with:
        packages-dir: dist
