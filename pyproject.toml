[build-system]
requires = [
    "setuptools==82.0.1",
    "wheel==0.46.3",
]
build-backend = "setuptools.build_meta"

[project]
version="1.32.2"
name = "icloudpd"
description = "icloudpd is a command-line tool to download photos and videos from iCloud."
readme = "README_PYPI.md"
requires-python = ">=3.10,<3.14"
keywords = ["icloud", "photo"]
license = {file="LICENSE.md"}
authors=[
    {name = "The iCloud Photo Downloader Authors"}
]
classifiers = [
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "requests==2.33.1",
    "schema==0.7.8",
    "tqdm==4.67.3",
    "piexif==1.1.3",
    "urllib3==1.26.20",
    "typing_extensions==4.15.0",
    "Flask==3.1.3",
    "waitress==3.0.2",
    # from pyicloud_ipd
    "tzlocal==5.3.1",
    "pytz==2026.1.post1",
    "certifi==2026.2.25",
    "keyring==25.7.0",
    "keyrings-alt==5.0.2",
    "srp==1.0.22",
]

[dependency-groups]
doc = [
    "furo==2025.12.19",
    "Sphinx==8.1.3",
    "sphinx-autobuild==2024.10.3",
    "myst-parser==4.0.1"
]
dev = [
    "twine==6.2.0",
    "pyinstaller==6.19.0",
    "wheel==0.46.3",
]
devlinux = [
    "auditwheel==6.6.0",
    #"staticx==0.14.1",
    "scons==4.10.1"
]
test = [
    "pytest==9.0.2",
    "mock==5.2.0",
    "freezegun==1.5.5",
    "vcrpy==8.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.15.8",
    "pytest-timeout==2.4.0",
    "pytest-xdist==3.8.0",
    "mypy==1.19.1",
    "types-pytz==2026.1.1.20260304",
    "types-tzlocal==5.1.0.1",
    "types-requests==2.31.0.2",
    "types-urllib3==1.26.25.14",
    "types-tqdm==4.67.3.20260303",
    "types-mock==5.2.0.20250924",
    "types-waitress==3.0.1.20260316",
]

[project.urls]
Homepage="https://github.com/icloud-photos-downloader/icloud_photos_downloader"

[project.scripts]
icloudpd = "icloudpd.cli:cli"
icloud = "pyicloud_ipd.cmdline:main"

[tool.pytest.ini_options]
log_format = "%(levelname)-8s %(message)s"
log_date_format = "%Y-%m-%d %H:%M:%S"
timeout = 300
testpaths = [
    "tests",
    "src" # needed for doctests    
]
pythonpath = [
    "src"
]
addopts = "--doctest-modules"

[tool.setuptools.packages.find]
where = ["src"]  # list of folders that contain the packages (["."] by default)
exclude = ["starters"]

[[tool.mypy.overrides]]
module = ['piexif.*', 'vcr.*', 'srp.*']
ignore_missing_imports = true

[tool.ruff]
line-length = 100

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]
ignore = [
    # long lines
    "E501",
    # lower case types
    "UP006",
    # deprecated typing namespace
    "UP035",
]

